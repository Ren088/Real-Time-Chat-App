<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>We Talk Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="join">
  <div class="card">
    <div id="preview">?</div>
    <h2>Join the room</h2>
    <p>Pili po kayo seerver.</p>
    <input id="name" maxlength="20" placeholder="Your name" autocomplete="off" aria-label="Your name">
    <div class="lbl">Choose a room</div>
    <div id="joinrooms"></div>
    <button id="enter">Join chat</button>
    <div class="note" id="support"></div>
  </div>
</div>

<div class="app"> 
  <aside class="side">
    <div class="brand">
      <div class="bars" id="bars" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1>We Talk</h1>
    </div>
    <div class="status"><span class="dot"></span><span id="count">1 online</span></div>
    <div class="sect">
      <div class="head">Rooms</div>
      <div class="rooms" id="rooms"></div>
      <input id="newroom" class="newroom" maxlength="20" placeholder="+ New room" autocomplete="off" aria-label="New room name">
    </div>
    <div class="sect ppl">
      <div class="head" id="peoplehead">In this room</div>
      <div class="people" id="people"></div>
    </div>
  </aside>
  <section class="main">
    <div class="roombar"><h2 id="roomname"># general</h2><span id="roomcount"></span></div>
    <div id="log" aria-live="polite"></div>
    <div id="typing"></div>
    <div class="composer">
      <input id="text" maxlength="500" placeholder="Write a message" autocomplete="off" aria-label="Message">
      <button id="send" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
